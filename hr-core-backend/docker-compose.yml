version: '3.9'

# ============================================================
# docker-compose.yml - Infraestructura LOCAL para desarrollo
#
# Sprint 2: Solo PostgreSQL. Kafka y Redis se añadirán después.
# Uso: docker-compose up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL - Base de datos principal
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hrcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrcore_dev
      POSTGRES_USER: hrcore_user
      POSTGRES_PASSWORD: hrcore_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrcore_user -d hrcore_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis - Caché para marcaciones de alta concurrencia
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hrcore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ----------------------------------------------------------
  # Zookeeper - Coordinador para Kafka
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: hrcore-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ----------------------------------------------------------
  # Kafka - Bus de eventos asíncronos
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: hrcore-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

# ----------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
