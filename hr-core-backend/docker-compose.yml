version: '3.9'

# ============================================================
# docker-compose.yml - Infraestructura LOCAL para desarrollo
#
# Sprint 2: Solo PostgreSQL. Kafka y Redis se añadirán después.
# Uso: docker-compose up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL - Base de datos principal
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hrcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrcore_dev
      POSTGRES_USER: hrcore_user
      POSTGRES_PASSWORD: hrcore_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrcore_user -d hrcore_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

# ----------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------
volumes:
  postgres_data:
