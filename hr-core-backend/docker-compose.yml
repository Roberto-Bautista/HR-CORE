version: '3.9'

# ============================================================
# docker-compose.yml - Infraestructura LOCAL para desarrollo
#
# Levanta todo lo necesario para que el backend corra en modo dev.
# Uso: docker-compose up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL - Base de datos principal
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hrcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrcore_dev
      POSTGRES_USER: hrcore_user
      POSTGRES_PASSWORD: hrcore_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrcore_user -d hrcore_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis - Cache de datos (saldo vacaciones, empleados, etc.)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hrcore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # ZooKeeper - Coordinador de Kafka (requerido por Kafka)
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: hrcore-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ----------------------------------------------------------
  # Kafka - Bus de eventos asíncronos
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: hrcore-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1   # 1 para entorno local
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # Kafka UI - Interfaz web para inspeccionar topics (solo dev)
  # Acceso: http://localhost:8090
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hrcore-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

# ----------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
