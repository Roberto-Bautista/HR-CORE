# ============================================================
# application.yml - Configuración BASE
# ============================================================

spring:
  application:
    name: hr-core-backend

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update            # Sprint 2: update para desarrollo. En producción será 'validate'
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # --- Flyway: migraciones automáticas de BD ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-on-validation-error: true
    clean-disabled: false

  # --- Kafka (DESACTIVADO hasta Sprint 6) ---
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# --- Actuator: endpoints de salud y métricas ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# --- Documentación OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

# --- Logging base ---
logging:
  level:
    root: INFO
    com.empresa.hrcore: INFO
